name: Build APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Setup JDK 11
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Install Python 2 and Ant
      run: |
        sudo apt-get update
        sudo apt-get install -y python2 ant
        sudo ln -sf /usr/bin/python2 /usr/bin/python

    - name: Install Android SDK components
      run: |
        yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
        $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platform-tools" "build-tools;28.0.3" "platforms;android-28"

    - name: Install legacy SDK tools (for ant build.xml)
      run: |
        wget -q https://dl.google.com/android/repository/tools_r25.2.5-linux.zip -O tools.zip
        unzip -q tools.zip -d $ANDROID_SDK_ROOT
        ls $ANDROID_SDK_ROOT/tools/ant/build.xml
        # 移除高版本build-tools，只保留28.0.3（旧版ant需要dx工具）
        rm -rf $ANDROID_SDK_ROOT/build-tools/37.0.0
        ls $ANDROID_SDK_ROOT/build-tools/

    - name: Download cocos2d-x external deps
      run: |
        cd cocos2d/external
        wget -q https://github.com/cocos2d/cocos2d-x-3rd-party-libs-bin/archive/v3-deps-29.zip -O deps.zip
        unzip -q deps.zip
        DEPS_DIR=$(ls -d cocos2d-x-3rd-party-libs-bin-*/)
        cp -r "$DEPS_DIR"* .
        rm -rf "$DEPS_DIR" deps.zip

    - name: Setup JDK 8 for build
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '8'

    - name: Download NDK r10e
      run: |
        wget -q https://dl.google.com/android/repository/android-ndk-r10e-linux-x86_64.zip
        unzip -q android-ndk-r10e-linux-x86_64.zip -d $HOME
        echo "NDK_ROOT=$HOME/android-ndk-r10e" >> $GITHUB_ENV

    - name: Build native code
      run: |
        cd proj.android
        export NDK_ROOT=$HOME/android-ndk-r10e
        export ANDROID_HOME=$ANDROID_SDK_ROOT
        set -o pipefail
        python build_native.py -b release 2>&1 | tail -60

    - name: Create local.properties
      run: |
        echo "sdk.dir=$ANDROID_SDK_ROOT" > proj.android/local.properties
        echo "sdk.dir=$ANDROID_SDK_ROOT" > cocos2d/cocos/platform/android/java/local.properties
        echo "sdk.dir=$ANDROID_SDK_ROOT" > cocos2d/cocos/platform/android/ControllerManualAdapter/local.properties

    - name: Build APK with Ant
      run: |
        cd proj.android
        export ANDROID_HOME=$ANDROID_SDK_ROOT
        ant debug

    - name: Find APK
      run: find proj.android -name "*.apk" -ls

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: doudizhu-apk
        path: proj.android/bin/*.apk
